[pytest]
asyncio_mode = auto

markers =
    unit: fast, no network, no cross-module wiring
    integration_offline: multi-component (OMS, reconciliation, engine boot, walk-forward, shutdown), mocks only, no network
    network: requires real HTTP/WebSocket calls to external APIs (GoldRush, Hyperliquid, etc.)
    testnet_live: requires a live Hyperliquid testnet connection / real order placement

testpaths = tests
python_files = test_*.py
