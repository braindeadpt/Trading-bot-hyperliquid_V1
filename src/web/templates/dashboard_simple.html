<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperliquid Bot — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e1a; color: #e0e6ed; min-height: 100vh; }
        .app-header { background: linear-gradient(135deg, #1a1f2e 0%, #0f1525 100%); padding: 1.5rem 2rem; border-bottom: 1px solid #2a3f5f; display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { font-size: 1.5rem; color: #00d4aa; }
        .status-badge { padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.875rem; font-weight: 600; }
        .status-running { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1400px; margin: 0 auto; }
        .card { background: linear-gradient(135deg, #1a1f2e 0%, #131a2b 100%); border-radius: 12px; padding: 1.5rem; border: 1px solid #2a3f5f; }
        .card h2 { font-size: 1.125rem; color: #8b9dc3; margin-bottom: 1rem; }
        .price-display { font-size: 2rem; font-weight: 700; color: #fff; }
        .price-change { font-size: 1rem; margin-top: 0.5rem; }
        .positive { color: #00d4aa; }
        .negative { color: #ff4757; }
        .info-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #2a3f5f; }
        .info-row:last-child { border-bottom: none; }
        .label { color: #8b9dc3; font-size: 0.875rem; }
        .value { color: #fff; font-weight: 600; }
        .loading { text-align: center; padding: 2rem; color: #8b9dc3; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; padding: 1rem; } }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>🤖 Hyperliquid Bot</h1>
        <span class="status-badge status-running" id="status-badge">● Running</span>
    </header>

    <div class="dashboard-grid">
        <!-- Preços -->
        <div class="card">
            <h2>📊 Preços de Mercado</h2>
            <div id="prices">
                <div class="info-row">
                    <span class="label">BTC</span>
                    <span class="value" id="btc-price">Loading...</span>
                </div>
                <div class="info-row">
                    <span class="label">ETH</span>
                    <span class="value" id="eth-price">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Sinal -->
        <div class="card">
            <h2>🎯 Sinal Atual</h2>
            <div id="signal">
                <div class="loading">A aguardar dados...</div>
            </div>
        </div>

        <!-- Posição -->
        <div class="card">
            <h2>💼 Posição</h2>
            <div id="position">
                <div class="info-row">
                    <span class="label">Estado</span>
                    <span class="value">Fora de mercado</span>
                </div>
            </div>
        </div>

        <!-- Capital -->
        <div class="card">
            <h2>💰 Capital</h2>
            <div class="price-display" id="capital">$10,000.00</div>
            <div class="price-change positive" id="daily-pnl">+0.00%</div>
        </div>

        <!-- Stats -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>📈 Estatísticas</h2>
            <div id="stats">
                <div class="info-row">
                    <span class="label">Total Trades</span>
                    <span class="value" id="total-trades">0</span>
                </div>
                <div class="info-row">
                    <span class="label">Win Rate</span>
                    <span class="value" id="win-rate">—</span>
                </div>
                <div class="info-row">
                    <span class="label">Profit Factor</span>
                    <span class="value" id="profit-factor">—</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Atualizar preços
                if (data.assets && data.assets.BTC) {
                    document.getElementById('btc-price').textContent = 
                        '$' + data.assets.BTC.close?.toLocaleString() || 'N/A';
                }
                if (data.assets && data.assets.ETH) {
                    document.getElementById('eth-price').textContent = 
                        '$' + data.assets.ETH.close?.toLocaleString() || 'N/A';
                }
                
                // Atualizar estado
                document.getElementById('status-badge').textContent = 
                    data.running ? '● Running' : '○ Stopped';
                document.getElementById('status-badge').className = 
                    'status-badge ' + (data.running ? 'status-running' : 'status-stopped');
            } catch (e) {
                console.log('Aguardando dados...');
            }
        }
        
        // Atualizar a cada 2 segundos
        setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>
</html>
