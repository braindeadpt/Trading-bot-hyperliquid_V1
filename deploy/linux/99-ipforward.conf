# Docker bridge NAT requires kernel IPv4 forwarding. dockerd asserts this at
# daemon start but nothing re-asserts it afterwards — any `sysctl -w`,
# `sysctl --system` reload, or netfilter/firewall reset can flip it to 0 and
# silently kill all container egress while the host keeps working
# (incident 2026-10-28). Install to /etc/sysctl.d/99-ipforward.conf.
net.ipv4.ip_forward=1
