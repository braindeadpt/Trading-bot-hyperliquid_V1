name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security audit
        run: python main.py --audit

      - name: Component health check
        run: python audit_all.py

      - name: Critical fixes tests
        run: python tests/test_critical_fixes.py

      - name: Phase 2 tests
        run: python tests/test_phase2.py

      - name: Phase 3 tests
        run: python tests/test_phase3.py

      - name: Phase 4 tests (maker orders)
        run: python tests/test_phase4.py

      - name: Phase 5 tests (live signing + dashboard auth)
        run: python tests/test_phase5_live_auth.py

      - name: Unit tests
        run: python -m unittest tests.test_basic
