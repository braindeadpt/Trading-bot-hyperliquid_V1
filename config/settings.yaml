bot:
  name: "Hyperliquid Momentum Bot"
  version: "0.1.0"
  paper_trading: true

assets:
  - "BTC"
  - "ETH"

timeframes:
  primary: "5m"
  secondary: "15m"

data_sources:
  binance:
    enabled: true
    base_url: "https://fapi.binance.com"
    weight: 0.4  # peso na agregação

  bybit:
    enabled: true
    base_url: "https://api.bybit.com"
    weight: 0.3

  okx:
    enabled: true
    base_url: "https://www.okx.com"
    weight: 0.2

  hyperliquid:
    enabled: true
    base_url: "https://api.hyperliquid.xyz"
    weight: 0.1

strategy:
  # Volume spike threshold (% acima da média)
  # 2.5 = 250% do volume médio (só entra em spikes MUITO fortes)
  # Mais filtragem = menos trades, melhor qualidade
  volume_spike_threshold: 2.5

  # OI change threshold (% em 1 minuto)
  oi_change_threshold: 0.015  # 1.5%

  # Funding rate extremes para evitar overcrowding
  max_funding_rate: 0.01  # 1%
  min_funding_rate: -0.01

  # Timeframes para médias móveis de volume
  # 100 períodos = ~8h em 5m (média estável para detetar spikes)
  volume_lookback: 100

  # Filtro de tendência: só entrar se preço acima da SMA
  # 60 períodos = ~5h em 5m (equivalente a 20 períodos em 15m)
  price_sma_period: 60

  # Mínimo de candles bullish consecutivos para confirmar
  # 2 candles de 5m = 10 minutos de confirmação (mais rápido que 15m)
  min_bullish_candles: 2

  # Mínimo de candles bearish consecutivos para SHORT
  # Mesmo critério — 2 candles de 5m = 10 minutos
  min_bearish_candles: 2

risk:
  max_position_size_usd: 100
  max_leverage: 2
  stop_loss_pct: 0.02  # 2%
  # Trailing stop ativa SÓ depois de atingir este lucro mínimo
  trailing_activation_pct: 0.015  # 1.5% - só ativa trailing depois disto
  trailing_stop_pct: 0.015  # 1.5% abaixo do máximo
  max_daily_trades: 5

polling:
  oi_interval: 30  # segundos
  price_interval: 5  # segundos (Hyperliquid WS)

logging:
  level: "INFO"
  file: "logs/bot.log"
