bot:
  name: "Hyperliquid Momentum Bot"
  version: "0.1.0"
  paper_trading: true

assets:
  - "BTC"
  - "ETH"

timeframes:
  primary: "15m"    # VENCEDOR 90 dias: PF 1.98, WR 69.4%, 49 trades
  secondary: "5m"   # Testado 90d: PF 1.45, Longs PF 0.73 (perdem!)

data_sources:
  binance:
    enabled: true
    base_url: "https://fapi.binance.com"
    weight: 0.4

  bybit:
    enabled: true
    base_url: "https://api.bybit.com"
    weight: 0.3

  okx:
    enabled: true
    base_url: "https://www.okx.com"
    weight: 0.2

  hyperliquid:
    enabled: true
    base_url: "https://api.hyperliquid.xyz"
    weight: 0.1

strategy:
  # PARÂMETROS ÓTIMOS (Grid Search v3 — 90 dias BTC, 216 combinações)
  # Timeframe vencedor: 15m | PF: 1.98 | WR: 69.4% | DD: 0.32%
  # Comparação 90d:
  #   15m: PF 1.98 | 49 trades (L:24 S:25) | Long PF 1.77 | Short PF 2.21
  #   5m:  PF 1.45 | 40 trades (L:13 S:27) | Long PF 0.73 | Short PF 2.05
  
  # Volume spike threshold
  # 90d vencedor: 4.0x (spikes MAIS fortes necessários em período longo)
  volume_spike_threshold: 4.0

  # OI change threshold
  oi_change_threshold: 0.01  # 1.0%

  # Funding rate extremes
  max_funding_rate: 0.01
  min_funding_rate: -0.01

  # Volume lookback
  volume_lookback: 100

  # SMA período
  # 90d vencedor: 100 em 15m = ~25h (mais estável que 60)
  price_sma_period: 100

  # Confirmação de candles
  # 90d vencedor: 1 candle (15min) — rápido captura movimento
  min_bullish_candles: 1
  min_bearish_candles: 1

  # Short settings
  short_volume_threshold: 4.0
  short_min_bearish_candles: 1
  short_enabled: true  # 90d: Shorts são rentáveis em 15m (PF 2.21)!

  # Regime detection
  market_regime_enabled: true

risk:
  max_position_size_usd: 100
  max_leverage: 2
  stop_loss_pct: 0.02
  short_stop_loss_pct: 0.02  # 2% igual para shorts (funcionam!)
  trailing_activation_pct: 0.015  # 1.5%
  trailing_stop_pct: 0.015  # 1.5% (90d ótimo vs 1.0% em 30d)
  max_daily_trades: 5

polling:
  oi_interval: 30
  price_interval: 5

logging:
  level: "INFO"
  file: "logs/bot.log"
