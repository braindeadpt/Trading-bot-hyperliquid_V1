# Hyperliquid Premium Bot — Configuration
# 
# All paths are relative to the project root unless absolute.

version: "1.0.0"

# ═══════════════════════════════════════════════════════════
# Trading mode
# ═══════════════════════════════════════════════════════════
mode: "paper"    # paper | testnet | mainnet

# ═══════════════════════════════════════════════════════════
# Assets & timeframes
# ═══════════════════════════════════════════════════════════
assets:
  - "BTC"
  - "ETH"
  - "SOL"

timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "1h"

# ═══════════════════════════════════════════════════════════
# Exchange configuration
# ═══════════════════════════════════════════════════════════
exchange:
  hyperliquid:
    ws_url: "wss://api.hyperliquid.xyz/ws"
    rest_url: "https://api.hyperliquid.xyz"
    testnet: false
  
  binance:
    rest_url: "https://api.binance.com"
    ws_url: "wss://stream.binance.com:9443/ws"
    ws_enabled: true

# ═══════════════════════════════════════════════════════════
# Risk management
# ═══════════════════════════════════════════════════════════
risk:
  initial_capital: 10_000.0
  max_positions: 5
  max_daily_trades: 5
  max_daily_loss_pct: 3.0           # circuit breaker trigger
  circuit_breaker_drawdown_pct: 10.0 # from peak
  per_trade_risk_pct: 1.0           # % of capital at risk per trade
  max_position_size_pct: 20.0       # % of capital in one position
  leverage_max: 10.0
  max_slippage_pct: 0.2             # reject signal if L2 slippage > 0.2%
  min_fill_ratio: 0.8              # reject signal if book covers <80% of size
  taker_fee_pct: 0.035              # Hyperliquid taker fee per side (0.035%)
  paper_slippage_pct: 0.05         # simulated slippage in paper mode (0.05%)

# ═══════════════════════════════════════════════════════════
# Strategy: Trend Follow (Smart Money Flow)
# ═══════════════════════════════════════════════════════════
strategy:
  trend_follow:
    enabled: true
    timeframe: "15m"
    confirmation_timeframe: "5m"
    volume_surge_multiplier: 1.5
    ema_period: 20
    atr_period: 14
    max_hold_hours: 4
    stop_loss_atr_multiplier: 2.0
    overcrowded_penalty: 0.2        # reduce confidence by 20%
    min_confidence: 0.40           # reduced from 0.50
    # Microstructure filters (Task 2.2)
    oir_long_threshold: 0.6         # OIR > 0.6 confirms long
    oir_short_threshold: -0.6       # OIR < -0.6 confirms short
    wall_proximity_pct: 0.005       # avoid walls within 0.5% of price
    rsi_min: 40.0                    # no long if RSI < 40
    rsi_max: 70.0                    # no short if RSI > 70

  # Regime filter (ADX-based strategy weighting)
  adx_period: 14
  adx_trend_threshold: 25.0       # ADX > 25 = trending regime
  adx_range_threshold: 20.0       # ADX < 20 = ranging regime
  regime_weights:
    trend:
      SmartMoneyFlow: 1.3           # boost trend following
      FundingExtreme: 0.7           # penalize mean reversion
      VWAPDeviation: 0.5            # penalize VWAP fade in trends
      LiquidationCatcher: 1.0       # neutral — liquidation can cascade in trends
      FundingArbitrage: 1.0         # neutral
      OrderBookScalper: 0.7         # penalize — trends override micro-imbalances
    range:
      SmartMoneyFlow: 0.7           # penalize trend following
      FundingExtreme: 1.3           # boost mean reversion
      VWAPDeviation: 1.5            # boost — range is ideal for VWAP fade
      LiquidationCatcher: 1.0       # neutral
      FundingArbitrage: 1.0         # neutral
      OrderBookScalper: 1.3         # boost — micro-patterns shine in range

  # ═══════════════════════════════════════════════════════════
  # Strategy: Mean Reversion (Funding Extreme)
  # ═══════════════════════════════════════════════════════════
  mean_reversion:
    enabled: true
    timeframe: "15m"
    context_timeframe: "1h"
    extreme_threshold: 0.0003       # 0.03% predicted funding (was 0.3% — funding is near zero)
    strong_threshold: 0.0002        # 0.02% predicted funding (was 0.2%)
    overcrowded_oi_pct: 65.0        # OI concentration on one side
    max_hold_minutes: 60
    stop_loss_pct: 2.0
    min_confidence: 0.55            # reduced from 0.65 for more signals
    # ── Task 2.3: Dynamic upgrades ──
    use_dynamic_percentile: true    # use rolling p90 instead of fixed thresholds
    funding_percentile_lookback: 90 # ~90 funding observations (30 days of 8h funding)
    funding_percentile: 90          # 90th percentile = "extreme"
    use_cross_exchange_confirm: true  # confirm funding is extreme across exchanges
    cross_exchange_deviation_max: 0.003  # HL funding can't deviate >0.3% from avg
    require_oi_decreasing: true     # only enter when OI is decreasing
    oi_delta_threshold: 0.0         # OI_delta must be < 0 (decreasing)
    use_predicted_primary: true     # use predicted funding as primary signal

  # ═══════════════════════════════════════════════════════════
  # Strategy: Funding Arbitrage (Task 3.1)
  # ═══════════════════════════════════════════════════════════
  funding_arbitrage:
    enabled: true
    min_funding_spread: 0.00005      # 0.005% spread (was 0.4% — adapt to near-zero funding)
    min_individual_funding: 0.00001  # each leg must have |funding| > 0.001% (was 0.2%)
    exit_threshold: 0.00001          # exit when funding reverts to <0.001%
    max_hold_hours: 8                # max hold until next funding payment
    pair_size_pct: 0.02              # 2% of capital per leg
    stop_loss_pct: 0.03              # 3% stop on each leg
    confidence: 0.75
    require_oi_stable: true          # avoid if OI is still surging
    oi_delta_max: 1000.0             # max OI increase allowed

  # ═══════════════════════════════════════════════════════════
  # Strategy: VWAP Deviation (Task 3.2)
  # ═══════════════════════════════════════════════════════════
  vwap_deviation:
    enabled: true
    z_threshold: 1.2                # |Z-score| > 1.2σ from VWAP (was 1.8 — more sensitive)
    volume_surge: 1.2               # volume > 120% of 24h average (was 150%)
    max_adx: 40.0                   # only trade when ADX < 40 (was 35)
    require_oir_confirm: false      # OIR confirmation optional (was required)
    oir_threshold: 0.3              # |OIR| > 0.3 (was 0.4)
    max_funding_opposite: 0.005     # avoid if funding extreme in signal direction
    base_size_pct: 0.01             # 1% base size
    max_size_pct: 0.03             # 3% max size
    stop_loss_atr_multiplier: 2.0   # ATR-based stop
    max_hold_hours: 4               # mean reversion is quick or wrong
    min_confidence: 0.55            # reduced from 0.65
    confidence_extreme: 0.75        # reduced from 0.85
    signal_throttle_ms: 180000      # 3 min between signals (was 5 min)

  # ═══════════════════════════════════════════════════════════
  # Strategy: OrderBook Imbalance Scalper
  # ═══════════════════════════════════════════════════════════
  orderbook_scalper:
    enabled: true
    bid_ask_ratio_long: 1.5          # bid_depth / ask_depth > 1.5 → excess bids → long
    bid_ask_ratio_short: 0.67        # bid_depth / ask_depth < 0.67 → excess asks → short
    take_profit_pct: 0.0025          # 0.25% take-profit
    stop_loss_pct: 0.002             # 0.20% stop-loss (R:R 1.25:1)
    base_size_pct: 0.005             # 0.5% capital
    max_size_pct: 0.01              # 1% max
    max_hold_seconds: 300            # 5 min max hold
    min_confidence: 0.55
    signal_throttle_ms: 60000        # 60s between signals per symbol

  # ═══════════════════════════════════════════════════════════
  # Strategy: Liquidation Catcher (Task 3.3)
  # ═══════════════════════════════════════════════════════════
  liquidation_catcher:
    enabled: true
    min_notional_usd: 5000000      # $5M in 5min to trigger (was $10M)
    min_liquidation_count: 3       # avoid single large liquidation (was 5)
    require_oi_decreasing: false   # OI check optional (was required — not always reliable)
    oi_delta_max: 0.0              # OI must be decreasing
    max_adx: 45.0                  # avoid in strong trends (was 40)
    base_size_pct: 0.005            # 0.5% — small size, catching a knife
    max_size_pct: 0.01              # 1% max
    stop_loss_atr_multiplier: 1.0  # tight stop
    max_hold_minutes: 30            # liquidation cascades resolve quickly
    take_profit_r: 1.5              # 1.5R take profit (was 2.0 — tighter target)
    min_confidence: 0.60            # reduced from 0.70
    signal_throttle_ms: 3600000     # 1h cooldown (was 2h)

  # ═══════════════════════════════════════════════════════════
  # Kelly Criterion Sizing (Task 4.4)
  # ═══════════════════════════════════════════════════════════
  kelly:
    enabled: true
    min_trades: 20                # minimum history before Kelly activates
    half_kelly: true               # use 0.5 * f* for safety
    max_multiplier: 2.0            # cap Kelly boost at 2x
    min_multiplier: 0.25           # floor Kelly reduction at 0.25x
    lookback_trades: 50           # rolling window for stats

  # ═══════════════════════════════════════════════════════════
  # Portfolio Heat & Governance (Task 4.1–4.3)
  # ═══════════════════════════════════════════════════════════
  portfolio_governance:
    max_directional_exposure_pct: 60   # 4.1: max 60% book same direction
    max_sector_exposure_pct: 30        # 4.2: max 30% in crypto sector
    daily_drawdown_circuit_pct: 5      # 4.3: daily drawdown > 5% = circuit breaker
    max_correlation: 0.70              # max |r| between any two positions (0=off)
    max_correlation_lookback: 60       # 60 periods (15m candles = 15h history)

  # ═══════════════════════════════════════════════════════════
  # Cooldown Manager (Task 2.4)
  # ═══════════════════════════════════════════════════════════
  cooldown:
    base_minutes: 60                # 1h base cooldown after any trade
    max_minutes: 240                # 4h max cooldown after consecutive losses
    multiplier: 2.0                 # double after each loss (1h → 2h → 4h)

  # ═══════════════════════════════════════════════════════════
  # Ensemble Configuration
  # ═══════════════════════════════════════════════════════════
  ensemble:
    threshold: 0.35                 # increased from 0.20 — require stronger consensus
    min_agreeing: 2                 # increased from 1 — need at least 2 strategies
    high_conviction_threshold: 0.65 # single strategy with >= 0.65 confidence bypasses threshold/min_agreeing

# ═══════════════════════════════════════════════════════════
# Backtest
# ═══════════════════════════════════════════════════════════
backtest:
  initial_capital: 100_000.0
  commission_pct: 0.04            # 4 bps (Hyperliquid taker)
  slippage_bps: 2.0               # 2 bps slippage

# ═══════════════════════════════════════════════════════════
# Data & database
# ═══════════════════════════════════════════════════════════
database:
  path: "data/live/bot.db"
  prune_days: 30                  # keep last 30 days of tick data

# ═══════════════════════════════════════════════════════════
# Dashboard
# ═══════════════════════════════════════════════════════════
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  push_interval_sec: 2.0

# ═══════════════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════════════
logging:
  level: "INFO"
  json: false
  file: "logs/bot.log"
  max_bytes: 10_485_760            # 10 MB
  backup_count: 30                # keep last 30 rotated logs
