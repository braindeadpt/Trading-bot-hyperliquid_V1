bot:
  name: "Hyperliquid Momentum Bot"
  version: "0.1.0"
  paper_trading: true

assets:
  - "BTC"

timeframes:
  primary: "15m"    # VENCEDOR com OI real: PF 2.50, WR 72.2%, 36 trades
  secondary: "5m"   # Testado: PF 1.45, Longs PF 0.73 (perdem!)

data_sources:
  binance:
    enabled: true
    base_url: "https://fapi.binance.com"
    weight: 0.4

  bybit:
    enabled: true
    base_url: "https://api.bybit.com"
    weight: 0.3

  okx:
    enabled: true
    base_url: "https://www.okx.com"
    weight: 0.2

  hyperliquid:
    enabled: true
    base_url: "https://api.hyperliquid.xyz"
    weight: 0.1

strategy:
  # PARÂMETROS ÓTIMOS (Grid Search v4 — OI Real CCXT, 30 dias)
  # Timeframe vencedor: 15m | PF: 2.50 | WR: 72.2% | DD: 0.29%
  #   36 trades (L:18 S:18) | Long PF: 1.75 | Short PF: 3.61
  # vs sem OI: PF 1.98 | WR: 69.4% — OI melhorou 26%!
  # vs 5m: PF 1.45 | Longs PF: 0.73 (perdem dinheiro)
  
  # Volume spike threshold
  # ÓTIMO: 4.0x (filtro muito apertado = apenas os MELHORES spikes)
  volume_spike_threshold: 4.0

  # OI change threshold — AGORA FUNCIONA com dados CCXT reais!
  # ÓTIMO: 1.0% de aumento no OI para confirmar entrada
  oi_change_threshold: 0.01  # 1.0%

  # Funding rate extremes para evitar overcrowding
  max_funding_rate: 0.01
  min_funding_rate: -0.01

  # Volume lookback
  volume_lookback: 100

  # SMA período
  # ÓTIMO: 100 períodos em 15m = ~25h (média estável)
  price_sma_period: 100

  # Confirmação de candles
  # ÓTIMO: 1 candle bullish (15min) — rápido captura movimento
  # Descoberta NOVA: 2 candles bearish (30min) para shorts é melhor!
  min_bullish_candles: 1
  min_bearish_candles: 2  # NOVO: 2 candles para shorts (era 1)

  # Short settings
  short_volume_threshold: 4.0
  short_min_bearish_candles: 2
  short_enabled: true  # Shorts FUNCIONAM com OI real! PF 3.61

  # Regime detection
  market_regime_enabled: true

risk:
  max_position_size_usd: 100
  max_leverage: 3  # Upgrade from 2x → 3x after Swarm V3 leverage optimization
  adaptive_leverage: true  # Auto-adjust: 2x (risky) / 3x (normal) / 5x (optimal)
  adaptive_conditions:
    low_leverage:
      funding_threshold: 0.0005  # Funding > 0.05% → 2x (expensive to hold)
      volatility_threshold: 0.06  # ATR14 > 6% → 2x (too volatile)
      streak_threshold: 3  # 3+ consecutive losses → 2x (bad run)
    high_leverage:
      funding_threshold: -0.0002  # Funding < -0.02% → 5x (get paid to hold)
      volatility_threshold: 0.03  # ATR14 < 3% → 5x (calm market)
      regime_boost: true  # Bull regime + long / Bear regime + short → +1x boost
  stop_loss_pct: 0.02
  short_stop_loss_pct: 0.02  # 2% igual para shorts
  # Trailing stop ativa SÓ depois de atingir este lucro mínimo
  trailing_activation_pct: 0.015  # 1.5%
  # ÓTIMO: 1.5% abaixo do máximo
  trailing_stop_pct: 0.015  # 1.5%
  max_daily_trades: 5
  
  # ⚡ CIRCUIT BREAKER — Perda diária máxima
  # SOFT STOP: Para trading se perder 5% num dia
  daily_loss_limit_pct: 0.05
  # HARD STOP: Para IMEDIATAMENTE se perder 10% num dia
  daily_loss_hard_stop_pct: 0.10
  
  # ⚡ MAINNET SAFETY
  # Confirmar antes de mudar para mainnet (evitar acidentes)
  mainnet_confirm_required: true
  # Tamanho máximo em mainnet (limita exposição inicial)
  mainnet_max_position_usd: 50
  # Primeiro trade em mainnet com tamanho mínimo ($10)
  mainnet_first_trade_size: 10

polling:
  oi_interval: 30
  price_interval: 5

logging:
  level: "INFO"
  file: "logs/bot.log"
