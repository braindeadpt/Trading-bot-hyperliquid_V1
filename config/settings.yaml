# Hyperliquid Premium Bot — Configuration
# 
# All paths are relative to the project root unless absolute.

version: "1.0.0"

# ═══════════════════════════════════════════════════════════
# Trading mode
# ═══════════════════════════════════════════════════════════
mode: "paper"    # paper | testnet | mainnet

# ═══════════════════════════════════════════════════════════
# Engine behaviour
# ═══════════════════════════════════════════════════════════
engine:
  # v3.1.42: close all positions on graceful stop?
  # false (paper/testnet): preserve open trades in DB for restore on next start.
  # true  (mainnet override): flatten on shutdown — required while SL/TP are
  #   software-managed in the bot loop; switch to false once native trigger
  #   orders (stop/take-profit) are placed via the Hyperliquid SDK on entry.
  close_positions_on_shutdown: false

# ═══════════════════════════════════════════════════════════
# Assets & timeframes
# ═══════════════════════════════════════════════════════════
assets:
  - "BTC"
  - "ETH"
  - "SOL"
  - "HYPE"

timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "1h"

# ═══════════════════════════════════════════════════════════
# Exchange configuration
# ═══════════════════════════════════════════════════════════
exchange:
  hyperliquid:
    ws_url: "wss://api.hyperliquid.xyz/ws"
    rest_url: "https://api.hyperliquid.xyz"
    testnet: false

  binance:
    rest_url: "https://api.binance.com"
    ws_url: "wss://stream.binance.com:9443/ws"
    ws_enabled: true

  # QW4 (v3.1.13): DataBus per-topic rate limits. Global cap stays at
  # 200 Hz; trade:* gets a 2000 Hz override so BTC/ETH/SOL trade bursts
  # don't drop. Set trade_rate_limit_hz=0 to disable for that prefix.
  databus:
    rate_limit_hz: 200
    trade_rate_limit_hz: 2000

# ═══════════════════════════════════════════════════════════
# Risk management
# ═══════════════════════════════════════════════════════════
risk:
  initial_capital: 10_000.0
  max_positions: 3                  # v3.1.40: was 5 — evita 4 shorts correlacionados (BTC/ETH/SOL/HYPE)
  max_daily_trades: 0              # 0 = unlimited (paper study); set e.g. 20 on mainnet
  max_daily_loss_pct: 3.0           # circuit breaker trigger
  circuit_breaker_drawdown_pct: 10.0 # from peak (real equity, not cash-only)
  circuit_breaker_recovery_pct: 50.0  # auto-reset when DD < 50% of trip level
  per_trade_risk_pct: 1.0           # % of capital at risk per trade
  max_position_size_pct: 2.0        # v3.1.48: was 5.0 — ~20% notional @10x; allows 2 same-side under 50% directional cap
  leverage_max: 10.0
  max_slippage_pct: 0.2             # reject signal if L2 slippage > 0.2%
  min_fill_ratio: 0.8              # reject signal if book covers <80% of size
  taker_fee_pct: 0.045              # HL perps tier-0 taker per side (0.045%)
  paper_slippage_pct: 0.02         # paper slippage per side (0.02%; was 0.05 — less pessimistic)
  # ── C1: Intraday volatility circuit breaker (soft gate, per-symbol) ──
  # Blocks new entries when ATR(1h) > multiplier * 7d baseline ATR.
  # Soft = never forces exits; only rejects new entries.
  volatility_circuit_breaker:
    enabled: true
    multiplier: 3.0                 # current ATR > 3x 7d-baseline → block
    baseline_window_bars: 168       # 7d × 24 hourly bars
    block_duration_min: 30          # entries blocked for 30 min after breach
    min_samples: 24                 # need ~1d of history before evaluating
  # ── C2: Time-of-day filter (block entries around funding resets) ──
  funding_blackout:
    enabled: true
    minutes_before: 5               # block this many minutes before each reset
    minutes_after: 5                # block this many minutes after each reset
    resets_utc: ["00:00", "08:00", "16:00"]  # CEX 8h funding cadence
  # ── v3.1.47: Anti-chasing + per-symbol sizing + daily stop streak ──
  max_daily_stop_losses: 4        # block new entries after N stop_loss exits/day (UTC)
  symbol_risk_multiplier:
    SOL: 0.5                        # half size on SOL until gates prove recovery
  chase_filter:
    enabled: true
    lookback_hours: 3.0
    max_runup_pct: 0.008            # reject if price moved >0.8% in signal direction
    exempt_strategies:
      - VolatilityBreakout
      - DonchianBreakout

# ═══════════════════════════════════════════════════════════
# Strategy: Trend Follow (Smart Money Flow)
# ═══════════════════════════════════════════════════════════
strategy:
  trend_follow:
    enabled: false                  # OFF v3.1.42: 2/10 wins desde 26/06 — VWAPDeviation cobre melhor este espaço
    timeframe: "15m"
    confirmation_timeframe: "5m"
    volume_surge_multiplier: 1.5
    ema_period: 20
    atr_period: 14
    max_hold_hours: 4
    stop_loss_atr_multiplier: 2.0
    take_profit_r_multiple: 2.0     # 2R TP — covers taker RT fees + slippage on small moves
    overcrowded_penalty: 0.2        # reduce confidence by 20%
    min_confidence: 0.30           # QW5: reduced from 0.40 to fire on more setups
    extreme_threshold: 0.0003        # align with near-zero funding regime (0.03%)
    # Microstructure filters (Task 2.2)
    oir_long_threshold: 0.6         # OIR > 0.6 confirms long
    oir_short_threshold: -0.6       # OIR < -0.6 confirms short
    wall_proximity_pct: 0.005       # avoid walls within 0.5% of price
    rsi_min: 40.0                    # no long if RSI < 40
    rsi_max: 70.0                    # no short if RSI > 70

  # ═══════════════════════════════════════════════════════════
  # Strategy: Volatility Breakout (Bollinger squeeze)
  # ═══════════════════════════════════════════════════════════
  volatility_breakout:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    squeeze_lookback: 20           # bars for BB-width percentile
    squeeze_percentile: 25.0       # width in bottom 25% = squeeze
    min_squeeze_bars: 3            # consecutive tight bars before break
    volume_surge: 1.5              # v3.1.26: tighter (was 1.3) — filters false breakouts, +70% PnL in walk-forward
    min_adx: 12.0                  # need some momentum building
    max_adx: 38.0                  # avoid exhausted trends
    require_oi_confirm: false      # optional OI delta direction filter
    base_size_pct: 0.01
    max_size_pct: 0.025
    stop_loss_atr_multiplier: 2.0      # wider stop — fewer whipsaw exits post-squeeze (was 1.5)
    take_profit_atr_multiplier: 6.0    # v3.1.39: was 4.0 — let winners run further (walk-forward winner)
    max_hold_hours: 6
    min_confidence: 0.55            # Phase 1: subir de 0.45 — menos trades, mais qualidade
    signal_throttle_ms: 1800000    # 30 min between signals per symbol
    require_trend_alignment: true  # long only in uptrend (EMA20>EMA50), short in downtrend
    trend_ema_fast: 20
    trend_ema_slow: 50
    failed_breakout_min_hold_ms: 2700000   # 45 min before failed-breakout exit
    failed_breakout_buffer_pct: 0.0015     # 0.15% beyond BB mid (was 0.1% — less noise)
    # --- v3.1.26 walk-forward winners (activated) ---
    use_trailing_stop: true         # WINNER: trailing EMA9 after 1R — captures more profit
    trailing_method: ema9           # ema9 | swing | atr  (ema9 best in W1+W3)
    trailing_start_r: 1.0           # start trailing after 1R favourable
    trailing_ema_period: 9
    trailing_atr_mult: 1.5
    trailing_swing_lookback: 5
    # --- v3.1.26 NOT activated (no-op in walk-forward) ---
    use_time_scaled_tp: false       # no effect — trades hit TP/SL before 3h threshold
    time_tp_first_hours: 3.0
    time_tp_after_r: 2.5
    # --- v3.1.35: retest entry mode (opt-in, default OFF — sweep pending) ---
    use_retest_entry: false
    retest_max_bars: 8              # ~2h on 15m candles
    retest_buffer_pct: 0.002        # 0.2% of price proximity to broken band
    retest_min_hold_ms: 900000      # wait >=1 bar after break before accepting retest
    # --- v3.1.36: weekday filter (opt-in) — block Friday afternoon new entries ---
    use_weekday_filter: false
    weekday_blocked_days: [4]       # 0=Mon ... 4=Fri (UTC)
    weekday_blocked_start_h: 18
    weekday_blocked_end_h: 24
    # --- v3.1.39: SL-to-BE after N R profit (cut losers early once green) ---
    use_sl_to_be_after_1r: true     # v3.1.39 walk-forward winner: PF W2 0.63→0.80, W3 2.95→3.57
    sl_to_be_r_trigger: 1.0         # move SL to BE after 1R favourable
    sl_to_be_buffer_pct: 0.001      # 0.1% beyond entry (avoid BE-exit on noise)

  # ═══════════════════════════════════════════════════════════
  # Strategy: Donchian Breakout (momentum breakout)
  # ═══════════════════════════════════════════════════════════
  donchian_breakout:
    enabled: false                  # OFF: Sharpe -7.4 na janela completa
    lookback: 20                   # channel lookback (15m candles)
    min_adx: 22.0                  # ADX must be >= 22 (trending regime)
    min_range_pct: 0.001           # 0.1% avg range minimum (anti-chop)
    atr_period: 14
    stop_atr_mult: 2.0
    tp_r_mult: 2.0                  # 2R take-profit (was implicit 1.5R default)
    base_size_pct: 0.01
    max_size_pct: 0.03
    max_hold_hours: 6
    signal_throttle_ms: 900000
    min_confidence: 0.40            # QW5: reduced from 0.55

  # Regime filter (ADX-based strategy weighting)
  adx_period: 14
  adx_trend_threshold: 25.0       # ADX > 25 = trending regime
  adx_range_threshold: 20.0       # ADX < 20 = ranging regime
  regime_weights:
    trend:
      SmartMoneyFlow: 1.0           # legacy — TrendPyramid is the new primary
      TrendPyramid: 1.3             # boost — primary trend strategy
      VolatilityBreakout: 1.4       # boost — squeeze breaks start trends
      DonchianBreakout: 1.3         # boost — breakout follows trend
      FundingExtreme: 0.7           # penalize mean reversion
      VWAPDeviation: 0.5            # penalize VWAP fade in trends
      RangeGrid: 0.4                # strongly penalize in trends
      LiquidationCatcher: 1.0       # neutral — liquidation can cascade in trends
      FundingArbitrage: 1.0         # neutral
      SpotPerpCarry: 1.1            # slight boost — funding carry works in trends
      FundingMomentum: 1.2          # boost — follow funding flips in trends
      OrderBookScalper: 0.7         # penalize — trends override micro-imbalances
      LeadLag: 1.0                   # neutral — lag arb works in trends and ranges
    range:
      SmartMoneyFlow: 0.7           # penalize trend following
      VolatilityBreakout: 0.6       # penalize — false breaks common in chop
      DonchianBreakout: 0.5         # penalize — chop kills breakout reliability
      FundingExtreme: 1.0           # neutral in range (was 1.3 — reduced churn in low funding)
      VWAPDeviation: 1.5            # boost — range is ideal for VWAP fade
      RangeGrid: 1.5                 # boost — primary range strategy
      LiquidationCatcher: 1.0       # neutral
      FundingArbitrage: 1.0         # neutral
      SpotPerpCarry: 1.2            # boost — funding carry works in quiet ranges
      FundingMomentum: 0.5          # penalize — flips less common in chop
      OrderBookScalper: 1.3         # boost — micro-patterns shine in range
      LeadLag: 1.1                  # slight boost — range chop still has BN lead pulses

  # ═══════════════════════════════════════════════════════════
  # Strategy: LeadLag (Binance → Hyperliquid short-term lag)
  # ═══════════════════════════════════════════════════════════
  lead_lag:
    enabled: false                  # Phase 1: 0 backtest trades — validar antes de ligar
    impulse_window_ms: 10000        # 10s Binance return window (5–15s typical)
    impulse_min_pct: 0.0005         # 0.05% min Binance impulse to trigger
    gap_min_pct: 0.0003             # 0.03% min HL lag beyond fees
    min_edge_buffer_pct: 0.0002     # extra buffer above HL spread + RT fees
    taker_fee_pct: 0.00045          # tier-0 taker fraction per side (0.045%) for gap math
    max_hl_spread_pct: 0.0012       # 0.12% — paper: HL book often wider than 0.08%
    require_oir_confirm: false      # paper: validate entries before re-tightening
    oir_threshold: 0.10             # used when require_oir_confirm is true
    convergence_pct: 0.0001         # gap closed → take profit (~0.01%)
    stop_gap_mult: 1.5               # stop = clamp(|gap| * mult, floor, ceiling)
    stop_floor_pct: 0.0008           # 0.08% minimum stop
    stop_ceiling_pct: 0.004          # 0.40% maximum stop
    min_tp_r: 1.0                    # reject if take_profit < stop * min_tp_r
    max_hold_seconds: 90             # time-stop if gap does not close
    impulse_reversal_pct: 0.0003    # exit if Binance impulse flips
    base_size_pct: 0.005            # 0.5% capital
    max_size_pct: 0.008             # 0.8% max
    min_confidence: 0.45
    max_confidence: 0.85
    signal_throttle_ms: 30000       # 30s between signals per symbol
    buffer_ms: 30000                # rolling mid history window
    max_binance_stale_ms: 2000      # skip if Binance tick older than 2s
    warmup_samples: 5

  # ═══════════════════════════════════════════════════════════
  # Strategy: Mean Reversion (Funding Extreme)
  # ═══════════════════════════════════════════════════════════
  mean_reversion:
    enabled: false                  # OFF: governor Sharpe -37 on 50 trades; re-enable after paper validation
    timeframe: "15m"
    context_timeframe: "1h"
    extreme_threshold: 0.0003       # floor when dynamic history is short
    strong_threshold: 0.0001
    min_strong_threshold_abs: 0.00006   # 0.006% 8h — skip noise entries in low-funding regime
    min_extreme_threshold_abs: 0.00009    # 0.009% 8h
    funding_reverted: 0.00002           # absolute near-zero funding (8h rate)
    funding_revert_fraction: 0.5        # exit when |funding| < 50% of |entry_funding|
    min_funding_exit_hold_ms: 900000      # 15 min before funding-based exit (avoid fee churn)
    min_profit_before_funding_exit_pct: 0.001  # need +0.1% price move vs entry for funding exit
    reentry_cooldown_ms: 600000           # 10 min anti-churn after any exit before re-entry
    overcrowded_oi_pct: 65.0        # OI concentration on one side
    max_hold_minutes: 60
    stop_loss_pct: 2.0
    take_profit_r_multiple: 2.0     # 2R TP (was hardcoded 1.5R)
    min_confidence: 0.40            # QW5: reduced from 0.55
    # ── Task 2.3: Dynamic upgrades ──
    use_dynamic_percentile: true    # use rolling p90 instead of fixed thresholds
    funding_percentile_lookback: 90 # ~90 funding observations (30 days of 8h funding)
    funding_percentile: 90          # 90th percentile = "extreme"
    use_cross_exchange_confirm: true  # confirm funding is extreme across exchanges
    cross_exchange_deviation_max: 0.003  # HL funding can't deviate >0.3% from avg
    require_oi_decreasing: true     # only enter when OI is decreasing
    oi_delta_threshold: 0.0         # OI_delta must be < 0 (decreasing)
    use_predicted_primary: true     # use predicted funding as primary signal
    require_real_oi_ratio: false    # use Binance LS ratio when available; heuristic fallback
    require_feed_health: true       # skip entries when market_data health is red
    max_venue_spread: 0.001         # reject if HL venues disagree >0.1% (8h)

  # ═══════════════════════════════════════════════════════════
  # Strategy: Funding Arbitrage (Task 3.1)
  # ═══════════════════════════════════════════════════════════
  funding_arbitrage:
    enabled: false                  # v3.1.18: KILLED — not a true arb (cross-asset carry with basis risk)
    auto_enable: false               # v3.1.18: KILLED — don't auto-activate
    auto_enable_min_net_spread: 0.0008   # 0.08% spread to turn on (RT fees ~0.07%)
    auto_disable_net_spread: 0.0005      # 0.05% hysteresis — avoid flicker when spread fades
    auto_enable_min_symbols: 2
    spread_check_interval_ms: 60000      # re-check spread every 60s
    min_net_spread: 0.0007         # 0.07% min spread after round-trip fees
    min_funding_spread: 0.00005      # 0.005% spread (was 0.4% — adapt to near-zero funding)
    min_individual_funding: 0.00001  # each leg must have |funding| > 0.001% (was 0.2%)
    exit_threshold: 0.00001          # exit when funding reverts to <0.001%
    max_hold_hours: 8                # max hold until next funding payment
    pair_size_pct: 0.02              # 2% of capital per leg
    stop_loss_pct: 0.03              # 3% stop on each leg
    take_profit_r: 2.0               # 2R TP per leg (was hardcoded 1.5R)
    confidence: 0.75
    require_oi_stable: true          # avoid if OI is still surging
    oi_delta_max: 1000.0             # max OI increase allowed
    use_multi_venue_predicted: true  # HL predictedFundings (Bin/Hl/Bybit) for ranking
    require_feed_health: true
    max_venue_spread: 0.001

  # ═══════════════════════════════════════════════════════════
  # Strategy: VWAP Deviation (Task 3.2)
  # ═══════════════════════════════════════════════════════════
  vwap_deviation:
    enabled: true
    z_threshold: 2.5                # |Z-score| > 2.5σ from VWAP (v3.1.18: was 1.2 — restore original)
    min_adx: 15.0                  # v3.1.18: don't trade in dead tape
    volume_surge: 1.5               # volume > 150% of 24h average (v3.1.18: was 1.2 — restore original)
    max_adx: 25.0                   # only trade when ADX < 25 (v3.1.18: was 40 — restore original)
    require_oir_confirm: true       # OIR confirmation required (v3.1.18: was false)
    oir_threshold: 0.4              # |OIR| > 0.4
    max_funding_opposite: 0.005     # avoid if funding extreme in signal direction
    base_size_pct: 0.01             # 1% base size
    max_size_pct: 0.03             # 3% max size
    stop_loss_atr_multiplier: 2.0   # ATR-based stop
    take_profit_r_multiple: 2.0     # 2R TP
    max_hold_hours: 4               # mean reversion is quick or wrong
    min_confidence: 0.70            # Phase 1: subir de 0.65 — menos trades, mais qualidade
    confidence_extreme: 0.85        # v3.1.18: was 0.65 — restore original
    signal_throttle_ms: 300000      # 5 min between signals (v3.1.18: was 3 min)
    # --- v3.1.26 walk-forward winners (activated) ---
    use_session_filter: true        # WINNER: W1 PF 10→16.5, mcPF_p05 0.68→1.56, WR 71→83%
    session_start_utc_h: 7          # EU session open
    session_end_utc_h: 22           # US session close
    session_allow_extreme_z: true   # allow |Z| >= 4 outside session (rare but high-conviction)
    session_extreme_z: 4.0
    # --- v3.1.26 NOT activated (no-op in walk-forward) ---
    use_sl_to_be_after_1r: false    # no effect — VWAP reversion exits before 1R reverts to entry
    sl_to_be_r_trigger: 1.0
    oir_disable_extreme_z: false    # no effect — no |Z|>=4 in historical data
    oir_extreme_z: 4.0
    use_dynamic_z: false            # no effect — ATR ratio ≈1 (no regime extremes in window)
    dynamic_z_min: 2.2
    dynamic_z_max: 3.5
    dynamic_z_atr_lookback: 168     # 7d * 24h (1h candles)
    exit_pre_funding_min: 0         # 0 = disabled; part of all_optimisations which was WORSE
    # v3.1.39: VWAP reversion exit threshold (was hardcoded 0.3). Lower = let winners run.
    exit_z_threshold: 0.3           # 0.3 = exit when |Z| < 0.3 (current default)

  # ═══════════════════════════════════════════════════════════
  # Strategy: VWAPTrend (research-only) — Zarattini & Aziz 2023 adapted to crypto
  # Anchored UTC-day VWAP trend-follow (long above / short below), opposite of
  # VWAPDeviation fade. NOT in ensemble / factory registry — instantiate only
  # from scripts/backtest_vwap_trend_vs_fade.py.
  #
  # VERDICT 2026-08-08 (light 15m/5m replay, 2026-05-18→2026-08-07,
  # BTC/ETH/SOL/HYPE, commission 0.04%/side ≈ 8 bps RT):
  #   (a) Fade VWAPDeviation:  n=224  WR=50%  PF=1.07  net=+$84   fees=$216
  #   (b) Trend VWAPTrend:     n=1498 WR=26%  PF=0.67  net=−$2224 fees=$1228
  #   (c) Hour filters (US paper/RTH, Asia, EU): cut fee bleed but expectancy
  #       stayed NEGATIVE — no usable crypto analogue of equity RTH seasonality.
  # CONCLUSION: trend does NOT beat fade after fees. Flip-every-cross is
  # unviable at crypto RT cost; do NOT enable without a new OOS window that
  # overturns this. Report: data/backtests/vwap_trend_vs_fade_20260808_000535.*
  # ═══════════════════════════════════════════════════════════
  vwap_trend:
    enabled: false                  # KILLED research 2026-08-08 — see verdict above
    vwap_confirm_tf: "15m"          # 5m|15m candle-close confirmation
    min_flip_interval_minutes: 30   # anti-flip (mandatory; RT fees kill micro-crosses)
    vwap_cross_buffer_pct: 0.001    # 0.1% dead-band around anchored VWAP
    max_hold_hours: 12              # no equity "flat at the bell"; crypto 24/7
    close_on_utc_rollover: true     # optional flat at 00:00 UTC day boundary
    use_session_filter: false       # hour filters reduced losses only, no +E[x]
    session_start_utc_h: 0
    session_end_utc_h: 24
    # session_hours_utc: [13, 14, 15, 19]  # US paper-hours probe (still −E[x])
    base_size_pct: 0.01
    max_size_pct: 0.03
    stop_loss_atr_multiplier: 2.0
    min_confidence: 0.55
    signal_throttle_ms: 60000
    min_session_bars: 3

  # ═══════════════════════════════════════════════════════════
  # Strategy: SFP Reversion (v3.1.33) — Swing Failure Pattern + 75% magnet
  # Liquidity sweep at pivot low/high, close back inside, target 75% retracement.
  # ═══════════════════════════════════════════════════════════
  sfp_reversion:
    enabled: false                  # OFF by default; enable after walk-forward validation
    pivot_lookback: 100             # bars to scan for pivots (~25h on 15m)
    pivot_max_age_bars: 30          # pivot must be within last 30 bars of the sweep
    pivot_min_separation_bars: 3    # min bars between pivot and sweep candle
    sweep_buffer_pct: 0.001         # 0.1% below pivot = sweep
    wick_rejection_min: 0.5         # close in upper half (long) / lower half (short)
    volume_surge: 1.5               # 150% of 24-bar avg volume on sweep candle
    require_oi_confirm: false       # OI rising for long / falling for short
    range_lookback: 100             # bars for 75% magnet range
    base_size_pct: 0.01
    max_size_pct: 0.025
    stop_buffer_pct: 0.003          # 0.3% beyond sweep extreme
    stop_loss_atr_multiplier: 1.5   # alt: max(sweep-based, ATR-based)
    take_profit_r_multiple: 2.5     # cap TP at 2.5R (magnet might be further)
    magnet_retracement: 0.75        # 75% retracement of sweep-to-opposite-extreme
    max_hold_hours: 6
    min_confidence: 0.60
    signal_throttle_ms: 1800000     # 30 min
    max_adx: 40.0                   # don't fade strong trends
    # Trailing stop (opt-in; same logic as VolatilityBreakout)
    use_trailing_stop: false
    trailing_method: ema9           # ema9 | swing | atr
    trailing_start_r: 1.0
    trailing_ema_period: 9
    trailing_atr_mult: 1.5
    trailing_swing_lookback: 5

  # ═══════════════════════════════════════════════════════════
  # Strategy: VA Rejection (v3.1.34) — Volume Profile Value Area rejection
  # Builds 24h Volume Profile, trades sweeps at VAH/VAL boundaries.
  # ═══════════════════════════════════════════════════════════
  va_rejection:
    enabled: false                  # OFF by default; enable after walk-forward validation
    vp_lookback: 96                 # 24h of 15m candles
    vp_bins: 50                     # price bins for volume profile
    va_pct: 0.70                    # 70% value area
    balanced_threshold: 0.60        # VA width / range > 0.60 = D-shape (skip)
    skip_balanced: true             # skip D-shape regimes
    volume_surge: 1.5               # 150% of 24-bar avg on rejection candle
    wick_rejection_min: 0.5         # close in upper half (long) / lower half (short)
    max_adx: 40.0                   # don't fade strong trends
    base_size_pct: 0.01
    max_size_pct: 0.025
    stop_buffer_pct: 0.003          # 0.3% beyond sweep wick
    stop_loss_atr_multiplier: 1.5
    take_profit_r_multiple: 2.5     # cap TP at 2.5R (VA opposite extreme might be further)
    max_hold_hours: 6
    min_confidence: 0.60
    signal_throttle_ms: 1800000     # 30 min
    use_trailing_stop: false
    trailing_method: ema9
    trailing_start_r: 1.0
    trailing_ema_period: 9
    trailing_atr_mult: 1.5
    trailing_swing_lookback: 5

  # ═══════════════════════════════════════════════════════════
  # Strategy: Checklist Meta (v3.1.37) — weighted bull/bear decision checklist
  # Replaces ensemble with transparent scoring across multiple components.
  # v3.1.38: ACTIVATED with score_threshold=3.5 (walk-forward winner)
  # v3.1.40: score_threshold 4.0 + size -25% — live PF 0.90, R:R ~1:1; apertar entradas
  # — only strategy profitable in W2 choppy regime (PF 1.61, ProbP 96%)
  # — complements VB (which dominates W1/W3 trending regimes)
  # ═══════════════════════════════════════════════════════════
  checklist_meta:
    enabled: true                   # v3.1.48: promoted to Phase08 execution (was shadow)
    score_threshold: 4.0            # v3.1.40: was 3.5 — fewer, higher-conviction signals
    min_confidence: 0.60
    # Chop / whipsaw gates (v3.1.x) — block range entries and post-stop reversals
    min_adx_gate: 18.0              # skip when ADX_14 < this (log: chop_gate)
    dominance_margin: 1.5           # |bull − bear| must exceed this beyond score_threshold
    flip_block_minutes: 60          # after stop on symbol, block opposite side N minutes
    # Component weights
    w_sfp: 1.5
    w_vwap: 1.0
    w_trend_structure: 1.0
    w_momentum: 0.5
    w_rsi_room: 0.5
    w_oi_delta: 0.5
    w_adx: 0.5
    w_oir: 0.5
    w_liquidation: 0.5
    # Indicator params
    ema_fast: 20
    ema_slow: 50
    adx_trend_min: 20.0
    oir_threshold: 0.3
    rsi_room_min: 40.0
    rsi_room_max: 60.0
    sfp_lookback: 100
    sfp_max_age_bars: 30
    # Sizing / risk
    base_size_pct: 0.0075           # v3.1.40: was 0.01 — -25% until live PF > 1.0
    max_size_pct: 0.01875           # v3.1.40: was 0.025 — proportional cap
    stop_loss_atr_multiplier: 1.5
    take_profit_atr_multiplier: 3.0
    max_hold_hours: 6
    signal_throttle_ms: 1800000
    # Trailing stop
    use_trailing_stop: false
    trailing_method: ema9
    trailing_start_r: 1.0
    trailing_ema_period: 9
    trailing_atr_mult: 1.5
    trailing_swing_lookback: 5
    # Weekday filter
    use_weekday_filter: false
    weekday_blocked_days: [4]
    weekday_blocked_start_h: 18
    weekday_blocked_end_h: 24
    # v3.1.41: SL-to-BE after N R — vol-aware trigger (v3.1.47)
    use_sl_to_be_after_1r: true
    sl_to_be_trigger_r: 0.6         # was 1.0R — SOL/ETH rarely reach 1R before reversal
    sl_to_be_vol_atr_factor: 0.75   # effective = min(trigger_r, factor×ATR%/stop%)
    sl_to_be_buffer_pct: 0.001
    # v3.1.47: forensic gates (scoring unchanged)
    counter_trend_adx_block: 30.0   # block long if ADX≥30 & EMA20<EMA50 (and mirror for short)
    require_oir_alignment: true
    oir_min_alignment: 0.10         # long needs OIR≥+0.10; short needs ≤−0.10; None passes

  # ═══════════════════════════════════════════════════════════
  # Strategy: OrderBook Imbalance Scalper
  # ═══════════════════════════════════════════════════════════
  orderbook_scalper:
    enabled: false                  # v3.1.18: KILLED — R:R 1.25:1 needs 67% win-rate (impossible)
    auto_enable: false               # v3.1.18: KILLED — don't auto-activate
    mode: momentum                  # momentum = follow heavy book side; fade = mean-revert imbalance
    mode: momentum                  # momentum = follow heavy book side; fade = mean-revert imbalance
    spoof_wall_proximity_pct: 0.001 # reject if supporting wall within 0.1% of mid
    # Anti-spoof (2026-08-09): wall_frac = largest_wall_size / same_side_depth_1pct.
    # Calibrated from live HL L2 (scripts/calibrate_obs_spoof_filter.py): 104 entry
    # candidates, p85 → spoof_wall_fraction_min=0.21 ≈ ~15% block rate.
    # DO NOT reintroduce depth_quality / spoof_depth_skew_min — that filter was
    # tautological with bid_ask_ratio (ask-heavy entry ⇒ depth_q≤0.35) and blocked
    # 100% of live signals. Code still accepts spoof_depth_skew_min but ignores it.
    spoof_wall_fraction_min: 0.21
    auto_enable_taker_fee_pct: 0.00015  # maker fee fraction when maker_orders enabled (0.015%)
    auto_enable_slippage_pct: 0.0005     # fallback slippage per side when book unknown
    auto_enable_min_edge_buffer_pct: 0.0005
    auto_enable_use_book_spread: true    # use half observed spread when tighter than fallback
    auto_enable_max_book_spread_pct: 0.0015   # 0.15% — HL book often wider than 0.04%
    auto_disable_max_book_spread_pct: 0.0025  # 0.25% hysteresis — disable when book widens
    auto_enable_min_symbols_with_book: 1
    viability_check_interval_ms: 60000
    bid_ask_ratio_long: 1.5          # bid_depth / ask_depth > 1.5 → bid-heavy book
    bid_ask_ratio_short: 0.67        # bid_depth / ask_depth < 0.67 → ask-heavy book
    take_profit_pct: 0.0025          # 0.25% take-profit
    stop_loss_pct: 0.002             # 0.20% stop-loss (R:R 1.25:1)
    base_size_pct: 0.005             # 0.5% capital
    max_size_pct: 0.01              # 1% max
    max_hold_seconds: 300            # 5 min max hold
    min_confidence: 0.40            # QW5: reduced from 0.55
    signal_throttle_ms: 60000        # 60s between signals per symbol

  # ═══════════════════════════════════════════════════════════
  # Strategy: Liquidation Catcher (Task 3.3)
  # ═══════════════════════════════════════════════════════════
  liquidation_catcher:
    enabled: false                  # shadow panel only until real-liq sample accumulates
    auto_enable: false              # do not auto-activate from feed_ready alone
    feed_warmup_events: 1           # real-venue events before feed_ready
    require_real_liquidation_data: true
    # PROVISIONAL thresholds (2026-08-09) — OKX-REST-only bootstrap calibration.
    # Artifact: data/backtests/parity_diag/liq_threshold_calibration_okx.json
    # Chosen: OKX 5m-window p90 (not p95) so shadow fires more often and n≥30
    # arrives sooner; extra shadow signals cost nothing.
    # CAVEAT: aggregator sums OKX+Bybit → multi-venue notional is systematically
    # larger, so $5.7M / count 18 will behave more like ~p75–p80 of the *aggregated*
    # distribution, not a true multi-venue p90. Recalibrate from DB (source!=proxy)
    # after weeks of real accumulation. Thresholds filter strategy signals only —
    # the aggregator persists every real event regardless.
    min_notional_usd: 5_700_000     # PROVISIONAL — OKX-only p90 ≈ $5.71M (see caveat above)
    min_liquidation_count: 18       # PROVISIONAL — OKX-only p90 count
    require_oi_decreasing: false    # paper: OI feed not always reliable on first hours
    oi_delta_max: 0.0              # used when require_oi_decreasing is true
    max_adx: 45.0                  # avoid fading very strong trends
    base_size_pct: 0.005            # 0.5% — small size, catching a knife
    max_size_pct: 0.01              # 1% max
    stop_loss_atr_multiplier: 1.0  # tight stop
    max_hold_minutes: 30            # liquidation cascades resolve quickly
    take_profit_r: 2.0              # 2R take profit
    min_confidence: 0.45            # paper: was 0.60 — allow more test entries
    signal_throttle_ms: 3600000     # 1h cooldown

  # ═══════════════════════════════════════════════════════════
  # Strategy: CVD OrderFlow (volume-tape divergence)
  # ═══════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════

  spot_perp_carry:
    enabled: false                  # OFF: 0 trades em backtest (precisa de Binance spot data)
    min_funding_hourly: 0.0005     # 0.05% per hour = ~55% APR
    exit_funding_hourly: 0.0001    # exit when funding normalizes
    max_hold_hours: 24
    base_size_pct: 0.02            # 2% of capital
    max_size_pct: 0.05            # 5% max
    basis_stop_pct: 0.02           # 2% basis divergence = stop
    min_confidence: 0.60
    signal_throttle_ms: 1800000    # 30 min cooldown after a close

  # ═══════════════════════════════════════════════════════════
  # Strategy: Range Grid (ping-pong in confirmed ranges)  v3.1.20
  # ═══════════════════════════════════════════════════════════
  range_grid:
    enabled: false                  # OFF: Sharpe -4.3 em backtest
    max_adx: 18                    # confirmed range regime
    bb_period: 20
    bb_std: 2.0
    bb_width_percentile_max: 40    # bottom 40% of history
    sr_lookback: 50                # Williams fractal lookback
    max_band_width_pct: 0.05       # reject if band > 5%
    band_offset_pct: 0.003         # 0.3% from S/R
    stop_offset_pct: 0.01          # 1% beyond S/R
    max_hold_hours: 4
    base_size_pct: 0.015           # 1.5% — conservative
    max_size_pct: 0.025
    min_confidence: 0.50
    signal_throttle_ms: 600000     # 10 min cooldown

  # ═══════════════════════════════════════════════════════════
  # Strategy: Trend Pyramid (EMA20 pullback + Chandelier)  v3.1.20
  # ═══════════════════════════════════════════════════════════
  trend_pyramid:
    enabled: false                  # OFF v3.1.42: 0/6 wins, −$15.77 desde 26/06 — re-avaliar só com novo walk-forward
    ema_fast: 20
    ema_slow: 50
    min_adx: 25
    pullback_threshold_pct: 0.005  # within 0.5% of EMA20
    pullback_vol_max: 0.8          # low volume on pullback
    chandelier_atr_mult: 3.0
    max_pyramids: 2
    pyramid_size_mult: 0.5         # each pyramid = 50% of initial
    pyramid_profit_r: 1.0
    base_size_pct: 0.02
    max_size_pct: 0.04
    min_confidence: 0.50
    signal_throttle_ms: 1800000
    pyramid_throttle_ms: 3600000   # 1h between pyramids
    atr_period: 14

  # ═══════════════════════════════════════════════════════════
  # Strategy: Funding Momentum (follow funding flips)  v3.1.20
  # ═══════════════════════════════════════════════════════════
  funding_momentum:
    enabled: false                  # OFF: 0 trades em backtest
    funding_flip_threshold: 0.0001
    oi_lookback_hours: 4
    ema_slow: 50
    min_adx: 20
    max_hold_hours: 12
    stop_atr_mult: 2.0
    tp_atr_mult: 3.0
    atr_period: 14
    base_size_pct: 0.015
    max_size_pct: 0.025
    min_confidence: 0.50
    signal_throttle_ms: 1800000

  # ═══════════════════════════════════════════════════════════
  # Strategy: CVD OrderFlow (volume-tape divergence)
  # ═══════════════════════════════════════════════════════════
  cvd_orderflow:
    enabled: false                  # OFF: 0 trades em backtest (precisa de OIR + buy/sell volume)
    # Rolling windows (in 1m bars) for multi-timeframe divergence confirmation
    window_short_bars: 5            # 5m CVD
    window_medium_bars: 15          # 15m CVD
    window_long_bars: 60            # 1h CVD
    # Signal thresholds
    min_divergence_strength: 0.35   # signed divergence must exceed this magnitude
    min_price_move_pct: 0.002       # 0.2% — avoid signalling on flat tape
    min_volume_usd: 50000.0         # filter thin books (USD notional)
    # ADX regime filter (avoid dead markets and strong trends)
    max_adx: 30.0
    min_adx: 12.0
    # OIR (orderbook imbalance) confirmation
    require_oir_confirm: true
    oir_threshold: 0.15
    # Risk management
    stop_loss_atr_multiplier: 2.0
    take_profit_r_multiple: 2.0
    stop_loss_floor_pct: 0.005      # 0.5% min stop
    stop_loss_ceiling_pct: 0.05     # 5% max stop
    max_hold_hours: 6
    # Sizing
    base_size_pct: 0.008            # 0.8% base
    max_size_pct: 0.02              # 2% max
    min_confidence: 0.45            # QW5: reduced from 0.60
    confidence_strong: 0.75        # QW5: reduced from 0.85
    signal_throttle_ms: 600000      # 10 min between signals per symbol

  # ═══════════════════════════════════════════════════════════
  # Kelly Criterion Sizing (Task 4.4)
  # ═══════════════════════════════════════════════════════════
  kelly:
    enabled: false                 # Phase08: Kelly out of execution until OOS proven
    min_trades: 20                # minimum history before Kelly activates
    half_kelly: true               # use 0.5 * f* for safety
    max_multiplier: 2.0            # cap Kelly boost at 2x
    min_multiplier: 0.25           # floor Kelly reduction at 0.25x
    lookback_trades: 50           # rolling window for stats

  # ═══════════════════════════════════════════════════════════
  # Portfolio Heat & Governance (Task 4.1–4.3)
  # ═══════════════════════════════════════════════════════════
  portfolio_governance:
    max_directional_exposure_pct: 50   # v3.1.40: was 40 — cap directional concentration (target 50%)
    max_sector_exposure_pct: 100       # 4.2: disabled (crypto-only bot); set <100 for multi-asset
    daily_drawdown_circuit_pct: 3      # Phase 1: baixar de 5 — cortar perdas cedo
    daily_drawdown_halt_entries: true
    daily_drawdown_flatten: true
    daily_drawdown_alert: true
    max_correlation: 0.85              # v3.1.40: was 0.98 (OFF) — block highly-correlated adds
    max_correlation_lookback: 60       # 60 periods (15m candles = 15h history)

  # ═══════════════════════════════════════════════════════════
  # Cooldown Manager (Task 2.4)
  # ═══════════════════════════════════════════════════════════
  cooldown:
    base_minutes: 30                # QW5: 30m base cooldown (was 60m)
    max_minutes: 120                # QW5: 2h max cooldown (was 4h)
    multiplier: 2.0                 # double after each loss (30m → 1h → 2h)

  # ═══════════════════════════════════════════════════════════
  # Phase 08 — edge isolation (ChecklistMeta + VWAP execution)
  # v3.1.48: re-registered after structural deadlock (VB+VWAP both
  # governor-disabled → 138× regime_expansion_no_allowed_strategies).
  # ChecklistMeta promotion is PARTLY in-sample (59% WR vs VB 42% in
  # 10/07–08/08 audit) — OOS walk-forward REQUIRED before treating as validated.
  # ═══════════════════════════════════════════════════════════
  phase08:
    enabled: true
    paper_only: true               # tier_a_hl_ohlc = data cert only; paper until Phase06 OOS
    execution_strategies:
      - VWAPDeviation
    shadow_strategies:
      - VolatilityBreakout
      - CVDOrderFlow
      - OrderBookScalper
      - FundingArbitrage
      - FundingMomentum
      - SpotPerpCarry
      - LeadLag
      - LiquidationCatcher
      - ChecklistMeta
    regime_router:
      enabled: true
      adx_range_threshold: 20.0    # ADX < 20 → low_vol (VWAP + ChecklistMeta)
      adx_trend_threshold: 25.0    # ADX > 25 → trend; 20–25 → expansion (ChecklistMeta fallback)
      sequential_contradiction_block_ms: 3600000  # 1h — block opposite-side flips
      fallback_strategy: VWAPDeviation  # never leave a regime with zero eligible strategies
    adx:
      timeframe: "15m"
      timeframe_s: 900
      period: 14
      closed_candles_only: true

  # ═══════════════════════════════════════════════════════════
  # Ensemble Configuration
  # ═══════════════════════════════════════════════════════════
  ensemble:
    # Phase 1 (2026-06-29): só VolatilityBreakout + VWAPDeviation, sem consenso ensemble.
    enabled: false                    # sub-estratégias correm directas no engine
    threshold: 0.40                   # se reativar: exigir 40%+ peso combinado
    min_agreeing: 2                   # se reativar: 2+ estratégias concordando
    high_conviction_threshold: 0.65
    high_conviction_enabled: false    # Phase 1: sem bypass de alta convicção
    high_conviction_exclude: []

  # ═══════════════════════════════════════════════════════════
  # Strategy performance governance (Phase 3)
  # ═══════════════════════════════════════════════════════════
  strategy_governance:
    enabled: true
    lookback_days: 30
    min_trades: 10                  # need N trades before disable decision
    min_sharpe: 0.0                 # disable sub-strategy if rolling Sharpe below
    eval_interval_ms: 3600000       # re-evaluate hourly
    min_active_strategies: 1        # v3.1.48: never disable the last execution strategy
    last_strategy_size_multiplier: 0.5  # when protecting last exec, cut size instead of disable
    # Fase 10 frozen-window floor — governor ignores trades entered before
    # this; updated at window re-registration 2026-08-08 (deadlock fix).
    ignore_trades_before_ms: 1786372085694  # Fase 10 window_start_ms (re-registered 2026-08-10 tier-0 fees)

# ═══════════════════════════════════════════════════════════
# Exchange reconciliation & native protection (Phase 03)
# ═══════════════════════════════════════════════════════════
reconciliation:
  enabled: true
  interval_sec: 60
  stale_threshold_sec: 120
  orphan_exchange_policy: ADOPT_AND_PROTECT   # FLATTEN | HALT
  mismatch_policy: HALT
  block_entries_when_stale: true

# ═══════════════════════════════════════════════════════════
# Execution & transaction cost analysis (Phase 2)
# ═══════════════════════════════════════════════════════════
execution:
  tca_enabled: true
  tca_mode: strict                   # live: reject TCA when L2 book unavailable
  min_edge_buffer_pct: 0.05         # 0.05% buffer above round-trip costs
  entry_debounce_ms: 5000
  # v3.1.42: legacy alias — prefer engine.close_positions_on_shutdown.
  # Paper default false (preserve positions across restarts).
  flatten_on_stop: false
  native_protection:
    enabled: true                   # place HL reduce-only SL/TP triggers on fill
    software_stop_redundancy: true  # bot loop still monitors stops when online
  oms_poll_interval_s: 5
  live_order_timeout_s: 60
  trailing_stop:
    enabled: true
    activation_pct: 0.01            # v3.1.41: was 0.02 — trail at +1% (57700 bounce: CL had +1% but trail never fired)
    trail_pct: 0.008                # Phase 1: subir de 0.5% para 0.8%
    # Strategies with explicit TP/exit logic — skip engine trailing (avoids early winner cuts)
    exclude_strategies:
      - VolatilityBreakout
      - VWAPDeviation           # Phase 1: TP próprio 2R
      - SmartMoneyFlow
      - TrendPyramid
  maker_orders:
    enabled: true
    maker_fee_pct: 0.015            # 0.015% per side (HL perps tier-0 maker)
    limit_offset_pct: 0.0           # 0 = join best bid/ask
    timeout_ms: 30000               # cancel unfilled limits after 30s (live)
    exit_as_maker: false            # exits stay taker for speed
    strategies:
      - OrderBookScalper
      - VWAPDeviation
      - DonchianBreakout
      - VolatilityBreakout
      - CVDOrderFlow

# ═══════════════════════════════════════════════════════════
# External market data feeds (Phase 2)
# ═══════════════════════════════════════════════════════════
market_data:
  # real = hl|okx|bybit|binance (never proxy). Was: binance (fstream dead here).
  # Restart paper to load MultiVenueLiquidationAggregator + this mode.
  liquidation_source: real          # real | binance | proxy | auto
  liquidation_okx_enabled: true
  liquidation_bybit_enabled: true
  liquidation_coinalyze_check: true # verify-only; never summed into strategy window
  liquidation_coinalyze_poll_sec: 900  # ≥600; ~0.27 req/min with 4 symbols
  long_short_ratio_enabled: true
  long_short_poll_sec: 300
  hl_predicted_funding_poll_sec: 90 # Hyperliquid INFO predictedFundings
  funding_poll_sec: 30              # CEX funding/OI aggregator interval
  funding_stale_max_sec: 300        # use last-good values up to 5 min on API failure
  funding_connect_timeout_sec: 10
  funding_total_timeout_sec: 25
  min_exchanges_for_green: 2        # health: yellow if fewer CEX sources
  coinalyze_api_key: ""             # or COINALYZE_API_KEY env / vault
  health_history_window_sec: 3600   # rolling window for poll failure %
  alert_red_after_sec: 300          # Telegram if overall health red > 5 min
  alert_red_cooldown_sec: 900       # min interval between market-data alerts
  block_funding_strategies_on_red: true  # FundingExtreme / FundingArbitrage skip on red feed
  block_entries_on_stale: true           # block new entries when feed health is red/stale
  block_entries_on_ws_unhealthy: true    # block entries when HL WS is unhealthy
  max_venue_spread: 0.001           # max HL Bin/Bybit/HlPerp 8h spread (0.1%) per symbol
  # Research L2 levels (NOT operational bot.db). See docs/L2_BOOK_RECORDING.md
  # Path is on HDD E: — sequential gzip appends; keeps SSD for bot.db random I/O.
  l2_recording:
    enabled: true
    # 2026-08-10: raised resolution — past cannot be re-sampled denser.
    # Measured ~23 MB/day at 2s/10; expected ~48–101 MB/day at 1s/25. See docs/DATA_ARCHITECTURE.md
    interval_sec: 1.0
    depth_levels: 25
    min_mid_change_bps: 1.0
    # Keep writes under the repository; mount external storage here if needed.
    path: "data/research/l2_books"
    retention_days: 365
    prune_interval_sec: 3600        # retention actually runs (start + hourly + stop)
    queue_max: 5000                 # adequate at 1s/25; watch recorder dropped after restart
    flush_interval_sec: 1.0
  feed_silence:
    enabled: true
    liquidation_okx_max_sec: 21600          # 6h
    liquidation_bybit_max_sec: 21600        # 6h
    liquidation_binance_max_sec: 21600      # 6h (expected degraded — fstream blocked)
    liquidation_coinalyze_check_max_sec: 43200  # 12h (low-freq verify)
    l2_book_recording_max_sec: 120          # research L2 level writer

# ═══════════════════════════════════════════════════════════
# Backtest
# ═══════════════════════════════════════════════════════════
backtest:
  initial_capital: 100_000.0
  commission_pct: 0.045           # 4.5 bps (HL perps tier-0 taker)
  slippage_bps: 2.0               # 2 bps slippage
  use_regime_weights: true        # Phase 2/3 parity with live
  use_cooldown: true
  kelly_override: null            # null = follow strategy.kelly.enabled; true/false = explicit backtest override
  use_kelly: true                 # deprecated — use kelly_override; kept for backward compatibility
  use_microstructure_proxy: true  # proxy OIR/spread from candle range — Tier B (see oir_proxy_calibration)
  # warmup_15m_bars: backtest-only; consumer defaults to 110
  # (src/backtest/engine.py). Declaring it here or in DEFAULT_CONFIG changes the
  # effective config_hash, which the Fase 10 frozen-window assert in main.py
  # treats as mid-window drift and refuses to start on.
  intrabar_conflict_policy: pessimistic  # pessimistic | optimistic when SL+TP same 1m bar
  sizing_version: phase05-risk-at-equity-v1
  tca_mode: proxy                    # strict = reject TCA without L2; proxy = Tier B only
  replay_data_quality:
    # parity_mode: backtest-only; consumer defaults to True
    # (src/backtest/replay_data_quality.py). Same frozen-hash reason as above.
    min_coverage_pct: 95.0             # used when parity_mode=false
    max_bar_gap_ms: 120000             # used when parity_mode=false
    max_funding_stale_ms: 300000       # funding series must be fresher than this
    max_oi_stale_ms: 300000
    require_funding: true
    require_oi: false

# ═══════════════════════════════════════════════════════════
# Data & database
# ═══════════════════════════════════════════════════════════
database:
  path: "data/live/bot.db"
  prune_days: 30                  # keep last 30 days of tick data
  auto_backfill_on_start: true    # fetch Binance candles if DB is empty/stale
  backfill_days: 7                # days of history per timeframe (Binance max 1000 bars)
  backfill_funding_days: 30       # funding + OI history for backtest (scripts/backfill_funding.py)
  backfill_perp_days: 30           # Binance USD-M perp mids for LeadLag backtest
  backfill_min_candles_15m: 80    # trigger backfill when 15m count below this
  backfill_timeframes: ["1m", "5m", "15m", "1h"]

# ═══════════════════════════════════════════════════════════
# Research DB — HL venue data contract (Phase 07/08)
# ═══════════════════════════════════════════════════════════
research:
  database:
    path: data/research/hyperliquid.db
  strict_mode: true
  continuous_sampling_enabled: true
  ws_microstructure_enabled: true    # DataBus trade + orderbook → research DB
  rest_sampling_enabled: false       # 60s REST poll — NOT Tier A; do not enable
  l2_min_interval_ms: 250            # ~4 L2 snapshots/sec per symbol
  tape_gap_threshold_ms: 5000
  l2_stale_threshold_ms: 10000
  health_report_interval_sec: 30
  tape_queue_max: 10000
  sampler_symbols: ["BTC", "ETH", "SOL", "HYPE"]
  backfill_symbols: ["BTC", "ETH", "SOL", "HYPE"]
  min_coverage_pct: 95.0
  gap_intervals: 2                   # split when gap > N × bar interval
  gap_intervals_by_tf:
    1m: 2
    5m: 2
    15m: 2
    1h: 2
  # max_gap_ms: optional override (legacy); default = gap_intervals × 1m
  goldrush:
    info_url: "https://hypercore.goldrushdata.com/info"
    backfill_days: 180
    min_coverage_pct: 99.0
    page_size_max: 5000

# ═══════════════════════════════════════════════════════════
# Dashboard
# ═══════════════════════════════════════════════════════════
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5000
  push_interval_sec: 2.0
  auth_enabled: false          # set true + password/token to require login
  password: ""                 # or BOT_DASHBOARD_PASSWORD / BOT_DASHBOARD_TOKEN env
  secret_key: ""               # Flask session secret (auto-generated if empty)

# ═══════════════════════════════════════════════════════════
# Alerts (Telegram / Discord)
# ═══════════════════════════════════════════════════════════
alerts:
  enabled: true                # send alerts to Telegram / Discord
  min_level: "warning"         # warning+error for general alerts (trade entry/exit use trade_alerts)
  trade_alerts: true           # always push trade entry/exit (ignores min_level)
  telegram_bot_token: ""       # or TELEGRAM_BOT_TOKEN env
  telegram_chat_id: ""         # or TELEGRAM_CHAT_ID env
  telegram_commands_enabled: true   # interactive /status, /positions, /pnl, …
  telegram_poll_interval_sec: 2
  telegram_digest_hours_utc: [8, 20]   # daily digest at 08:00 and 20:00 UTC
  telegram_weekly_digest_day: 0        # 0=Monday
  telegram_weekly_digest_hour_utc: 8
  discord_webhook_url: ""      # or DISCORD_WEBHOOK_URL env

# ═══════════════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════════════
logging:
  level: "INFO"
  json: false
  file: "logs/bot.log"
  max_bytes: 10_485_760            # 10 MB per-file size cap (safety net)
  backup_count: 14                 # QW3: keep 14 days of rotated logs (time-based)
  rotation_when: "midnight"        # QW3: daily rotation
  rotation_interval: 1
  rotation_utc: false              # rotate at local midnight; set true for UTC-based rotation

# ═══════════════════════════════════════════════════════════
# Per-mode overrides (C3 mainnet defaults)
# ═══════════════════════════════════════════════════════════
# Shallow-merged on top of the active section when ``mode`` matches.
# Use to ship safer defaults for mainnet without duplicating the YAML.
mode_overrides:
  mainnet:
    reconciliation:
      orphan_exchange_policy: HALT
    engine:
      # mainnet flatten até SL/TP serem trigger orders nativas via SDK
      # Flatten until SL/TP are native HL trigger orders (SDK) on entry.
      close_positions_on_shutdown: true
    strategy:
      # v3.1.22: disable high-frequency / latency-sensitive strategies
      # on mainnet. Their edge depends on colocation-grade latency
      # and zero maker rebates, which a home/VM deployment cannot
      # sustain against HFT competition.
      orderbook_scalper:
        enabled: false          # too risky for mainnet (fee bleed)
      lead_lag:
        enabled: false          # latency arb needs colocation
      liquidation_catcher:
        min_notional_usd: 50_000_000   # production: only real cascades
        min_liquidation_count: 5
        require_oi_decreasing: true
        min_confidence: 0.60
      range_grid:
        enabled: true           # safe, range trading
      spot_perp_carry:
        enabled: true           # true arbitrage, safe
    risk:
      leverage_max: 5.0           # down from 10.0 — half the exposure
      max_daily_loss_pct: 2.0     # down from 3.0
      max_daily_trades: 20        # explicit cap (was 0 = unlimited)
      max_position_size_pct: 3.0  # down from 5.0
    execution:
      # v3.1.22: prefer maker orders on mainnet to capture the
      # rebate. Taker fees (0.045%/side tier-0) compound quickly on
      # short-duration strategies.
      maker_orders:
        enabled: true
      # mainnet flatten até SL/TP serem trigger orders nativas via SDK
      # Mainnet: flatten on stop while exits are bot-managed (no SDK triggers yet).
      flatten_on_stop: true
  testnet:
    reconciliation:
      orphan_exchange_policy: ADOPT_AND_PROTECT
    engine:
      close_positions_on_shutdown: false  # v3.1.42: preserve like paper
    strategy:
      lead_lag:
        enabled: true
      liquidation_catcher:
        auto_enable: true
        min_notional_usd: 5_000_000   # same $5M test threshold as paper
        min_liquidation_count: 3
        require_oi_decreasing: false
        min_confidence: 0.45
    risk:
      max_daily_trades: 50        # cap for testnet (was 0)
    execution:
      flatten_on_stop: false      # v3.1.42: preserve positions across restarts
