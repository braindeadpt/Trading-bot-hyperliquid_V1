bot:
  name: "Hyperliquid Momentum Bot"
  version: "0.1.0"
  paper_trading: true

assets:
  - "BTC"

timeframes:
  primary: "15m"    # VENCEDOR com OI real: PF 2.50, WR 72.2%, 36 trades
  secondary: "5m"   # Testado: PF 1.45, Longs PF 0.73 (perdem!)

data_sources:
  binance:
    enabled: true
    base_url: "https://fapi.binance.com"
    weight: 0.4

  bybit:
    enabled: true
    base_url: "https://api.bybit.com"
    weight: 0.3

  okx:
    enabled: true
    base_url: "https://www.okx.com"
    weight: 0.2

  hyperliquid:
    enabled: true
    base_url: "https://api.hyperliquid.xyz"
    weight: 0.1

strategy:
  # PARÂMETROS ÓTIMOS (Grid Search v4 — OI Real CCXT, 30 dias)
  # Timeframe vencedor: 15m | PF: 2.50 | WR: 72.2% | DD: 0.29%
  #   36 trades (L:18 S:18) | Long PF: 1.75 | Short PF: 3.61
  # vs sem OI: PF 1.98 | WR: 69.4% — OI melhorou 26%!
  # vs 5m: PF 1.45 | Longs PF: 0.73 (perdem dinheiro)
  
  # Volume spike threshold
  # FIX: Baixado de 4.0x para 2.0x (MA real de 5m, não 24h teórico)
  volume_spike_threshold: 2.0

  # OI change threshold — AGORA FUNCIONA com dados CCXT reais!
  # ÓTIMO: 1.0% de aumento no OI para confirmar entrada
  oi_change_threshold: 0.01  # 1.0%

  # Funding rate extremes para evitar overcrowding
  max_funding_rate: 0.01
  min_funding_rate: -0.01

  # Volume lookback
  volume_lookback: 100

  # SMA período
  # ÓTIMO: 100 períodos em 15m = ~25h (média estável)
  price_sma_period: 100

  # Confirmação de candles — EQUILIBRADO (fix bias long)
  # Ambos iguais para evitar bias de direção
  min_bullish_candles: 2
  min_bearish_candles: 2

  # Short settings — IGUAL ao long (fix bias)
  short_volume_threshold: 2.0  # FIX: Igual ao long, 4.0x era impossível
  short_min_bearish_candles: 2
  short_enabled: true

  # ⚡ DYNAMIC SL/TP — SL apertado, folga dinâmica em lucro
  dynamic_sl_pct: 0.03         # SL inicial 3% (mais apertado que 5%)
  breakeven_pct: 0.01         # Breakeven @ +1% de lucro
  trailing_dynamic: true      # Trailing baseado em ATR (não fixo)
  atr_period: 14              # Período para cálculo de ATR
  
  # ⚡ COOLDOWN — Evita entradas repetidas no mesmo candle
  entry_cooldown_seconds: 300  # 5 minutos entre trades

  # ⚡ TAKE PROFIT — Target de lucro (ratio 1:2 vs stop loss 5%)
  take_profit_pct: 0.10        # 10% — ratio 1:2 (risco 5%, recompensa 10%)

  # ⚡ FILTRO DE REGIME — Não tradar em condições extremas
  regime_filter_enabled: true
  max_volatility_pct: 5.0      # Vol > 5% = no trade (whipsaw)
  max_price_vs_sma_pct: 5.0   # Preço > 5% da SMA200 = no trade (extended)

  # Regime detection
  market_regime_enabled: true

  # Volume Profile (Fase A — filtro de qualidade para entradas)
  vp_enabled: true           # Ativar filtro Volume Profile
  vp_lookback: 96            # Candles para calcular VP (96 de 15m = 24h)

# ⚡ PARÂMETROS DE BACKTEST REALISTA
backtest_costs:
  taker_fee: 0.00045        # 0.045% Hyperliquid taker
  maker_fee: 0.00015        # 0.015% Hyperliquid maker
  slippage_btc: 0.0002      # 0.02% BTC slippage
  slippage_eth: 0.0021     # 0.21% ETH slippage
  funding_hourly_avg: 0.00001  # 0.001% média por hora de hold

risk:
  max_position_size_usd: 100
  max_leverage: 3  # Upgrade from 2x → 3x after Swarm V3 leverage optimization
  adaptive_leverage: true  # Auto-adjust: 2x (risky) / 3x (normal) / 5x (optimal)
  adaptive_conditions:
    low_leverage:
      funding_threshold: 0.0005  # Funding > 0.05% → 2x (expensive to hold)
      volatility_threshold: 0.06  # ATR14 > 6% → 2x (too volatile)
      streak_threshold: 3  # 3+ consecutive losses → 2x (bad run)
    high_leverage:
      funding_threshold: -0.0002  # Funding < -0.02% → 5x (get paid to hold)
      volatility_threshold: 0.03  # ATR14 < 3% → 5x (calm market)
      regime_boost: true  # Bull regime + long / Bear regime + short → +1x boost
  stop_loss_pct: 0.05          # AUMENTADO: 3.5% → 5% (mais respiro para volatilidade)
  short_stop_loss_pct: 0.05    # AUMENTADO: 3.5% → 5% (igual ao long)
  # Trailing stop ativa SÓ depois de atingir este lucro mínimo
  trailing_activation_pct: 0.02  # FIX: 1.5% → 2%
  # ÓTIMO: 2% abaixo do máximo
  trailing_stop_pct: 0.02       # FIX: 1.5% → 2%
  max_daily_trades: 5
  
  # ⚡ CIRCUIT BREAKER — Perda diária máxima
  # SOFT STOP: Para trading se perder 5% num dia
  daily_loss_limit_pct: 0.05
  # HARD STOP: Para IMEDIATAMENTE se perder 10% num dia
  daily_loss_hard_stop_pct: 0.10
  
  # ⚡ MAINNET SAFETY
  # Confirmar antes de mudar para mainnet (evitar acidentes)
  mainnet_confirm_required: true
  # Tamanho máximo em mainnet (limita exposição inicial)
  mainnet_max_position_usd: 50
  # Primeiro trade em mainnet com tamanho mínimo ($10)
  mainnet_first_trade_size: 10

polling:
  oi_interval: 30
  price_interval: 5

logging:
  level: "INFO"
  file: "logs/bot.log"
